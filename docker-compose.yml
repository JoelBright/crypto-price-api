services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "bundle exec rails db:prepare && bundle exec puma -C config/puma.rb"
    ports:
      - "3001:3000"
    environment:
      RAILS_ENV: development
      # DATABASE_URL connects via the internal Docker network (service name 'db').
      # Host port mapping (5433:5432, 3001:3000) avoids collisions with local
      # PostgreSQL or Rails instances running on the host.
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
      RAILS_MAX_THREADS: 5
      RAILS_LOG_LEVEL: debug
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  jobs:
    build: .
    # Solid Queue supervisor: manages workers, dispatchers, and the recurring-task
    # scheduler in a single process. Uses bin/jobs generated by solid_queue:install.
    command: bundle exec bin/jobs
    environment:
      RAILS_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
      RAILS_MAX_THREADS: 5
      RAILS_LOG_LEVEL: debug
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
